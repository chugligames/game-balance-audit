<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladoo Spin balance charts</title><style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--grid:#e5e5ea;--band:rgba(0,158,115,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f7;--muted:#a1a1a6;--grid:#2c2c2e;--band:rgba(0,158,115,.18)}}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;margin:0 auto;max-width:720px;padding:16px}
figure{margin:0 0 28px}svg{width:100%;height:auto}.t{fill:var(--fg);font-weight:600;font-size:13px}.a{fill:var(--muted);font-size:11px}
.g{stroke:var(--grid)}.thr{stroke:#D55E00;stroke-dasharray:3 3;stroke-width:2}.band{fill:var(--band)}.ci{stroke:var(--fg);stroke-width:1.5}
figcaption{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px}figcaption i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
</style></head><body><h1>Ladoo Spin</h1><p>Dashed orange line: a limit, or the fair value. Green band: the designer's target. Hover a point or bar for its value.</p><figure><svg viewBox="0 0 640 170" role="img" aria-label="RTP (target 0.96, below 1 so coins drain) · by scenario (lower is better; grey breaks a constraint)"><text x="0" y="16" class="t">RTP (target 0.96, below 1 so coins drain) · by scenario (lower is better; grey breaks a constraint)</text><line x1="230.0" x2="230.0" y1="26" y2="160" class="g"/><line x1="343.3" x2="343.3" y1="26" y2="160" class="g"/><line x1="456.7" x2="456.7" y1="26" y2="160" class="g"/><line x1="570.0" x2="570.0" y1="26" y2="160" class="g"/><text x="222" y="45.0" class="a" text-anchor="end">three MANGO pays 6</text><rect x="230.0" y="33" width="216.4" height="16" rx="3" fill="#0072B2"><title>three MANGO pays 6: 0.95</title></rect><text x="452.4" y="45.0" class="a">0.95</text><text x="222" y="71.0" class="a" text-anchor="end">three MANGO pays 5</text><rect x="230.0" y="59" width="211.7" height="16" rx="3" fill="#9a9aa0"><title>three MANGO pays 5: 0.93</title></rect><text x="447.7" y="71.0" class="a">0.93 ✗</text><text x="222" y="97.0" class="a" text-anchor="end">any three sweets pays 1.5</text><rect x="230.0" y="85" width="212.3" height="16" rx="3" fill="#9a9aa0"><title>any three sweets pays 1.5: 0.94</title></rect><text x="448.3" y="97.0" class="a">0.94 ✗</text><text x="222" y="123.0" class="a" text-anchor="end">reel 2: a CHILLI becomes BLANK</text><rect x="230.0" y="111" width="228.8" height="16" rx="3" fill="#9a9aa0"><title>reel 2: a CHILLI becomes BLANK: 1.01</title></rect><text x="464.8" y="123.0" class="a">1.01 ✗</text><text x="222" y="149.0" class="a" text-anchor="end">baseline</text><rect x="230.0" y="137" width="235.2" height="16" rx="3" fill="#9a9aa0"><title>baseline: 1.04</title></rect><text x="471.2" y="149.0" class="a">1.04 ✗</text></svg></figure></body></html>
